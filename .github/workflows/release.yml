name: Release

# Une release par étiquette. Rien ne se publie sur un simple push : une
# étiquette est un geste délibéré, un commit ne l'est pas toujours.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # La série complète tourne sans matériel. Les vérifications qui exigent
      # une manette sont derrière --ignored et restent donc de côté.
      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      # Le nom porte la version : un exécutable téléchargé se retrouve vite
      # séparé de la page qui l'a livré.
      - name: Name the binary
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "dev" }
          Copy-Item target\release\sc-battery.exe "sc-battery-$tag.exe"
          "ASSET=sc-battery-$tag.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $size = (Get-Item target\release\sc-battery.exe).Length
          "Binaire : $([math]::Round($size / 1KB)) Ko"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            Un binaire autonome pour Windows. Aucun runtime à installer :
            télécharger, lancer, l'icône apparaît dans la zone de notification.

            `--lang en|fr` force la langue, `--debug` ouvre le mode de simulation.

      # Sans étiquette — lancement manuel — on garde tout de même le binaire,
      # pour pouvoir l'essayer sans publier quoi que ce soit.
      - name: Attach the binary to the run
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: sc-battery
          path: ${{ env.ASSET }}
