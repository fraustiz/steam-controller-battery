[package]
name = "sc-battery"
version = "0.1.0"
edition = "2021"
description = "Indicateur de batterie de la Steam Controller 2026 dans la zone de notification"
license = "MIT"

[dependencies]
hidapi = "2.6"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
